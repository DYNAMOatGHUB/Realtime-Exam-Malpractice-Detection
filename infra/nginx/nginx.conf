worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Large video upload support (1GB+ exam recordings)
    client_max_body_size     4096M;   # 4 GB max upload size
    client_body_timeout      600s;    # 10 min to receive request body
    proxy_connect_timeout    60s;
    proxy_send_timeout       600s;    # 10 min to send to upstream
    proxy_read_timeout       600s;    # 10 min to receive from upstream
    client_body_buffer_size  128k;    # Stream body through small buffer (not RAM)
    proxy_request_buffering  off;     # Stream upload directly to Django, no Nginx RAM buffer

    # ---- Upstream services ----
    upstream fastapi {
        server fastapi:8000;
    }

    upstream django {
        server dashboard:8001;
    }

    # ---- HTTP server ----
    server {
        listen 80;
        server_name _;

        # FastAPI inference API
        location /api/ {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # FastAPI WebSocket for live stream detections
        location /ws/ {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 86400s;
        }

        # MJPEG stream endpoint
        location /stream/ {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_buffering    off;
            proxy_read_timeout 86400s;
        }

        # Django dashboard (all other routes)
        location / {
            proxy_pass         http://django;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_request_buffering off;   # stream upload body directly, no Nginx buffer
            proxy_read_timeout      600s;  # 10 min for large file handling
            proxy_send_timeout      600s;
        }

        # Django static files served directly by nginx
        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Django media files
        location /media/ {
            alias /app/media/;
            expires 1d;
        }

        # MinIO console proxy
        location /minio/ {
            proxy_pass http://minio:9001/;
            proxy_set_header Host $host;
        }
    }
}
