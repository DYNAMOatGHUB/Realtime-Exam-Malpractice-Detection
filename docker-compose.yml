services:
  # ─── Infrastructure ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eids_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eids_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: eids_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-setup:
    image: minio/mc:latest
    container_name: eids_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/setup.sh"]
    volumes:
      - ./infra/minio/setup.sh:/setup.sh
    environment:
      MINIO_HOST: minio:9000
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

  # ─── FastAPI Inference Backend ────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eids_fastapi
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./ml/weights:/ml/weights        # writable so Ultralytics can auto-download
      - ./ml:/ml:ro                     # ML module code importable as /ml/models/...
      - ./backend:/app
      - ./media:/app/media
    ports:
      - "8002:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Celery Inference Workers (GPU) ──────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: eids_celery_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - postgres
      - fastapi
    volumes:
      - ./ml/weights:/ml/weights
      - ./ml:/ml:ro
      - ./backend:/app
      - ./media:/app/media
    environment:
      - YOLO_CONFIG_DIR=/ml/weights
      - ULTRALYTICS_SETTINGS=/ml/weights/.config

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: eids_celery_beat
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./ml/weights:/ml/weights
      - ./ml:/ml:ro
      - ./backend:/app
      - ./media:/app/media
    command: celery -A app.celery_app beat --loglevel=info

  # ─── Django Dashboard ─────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: eids_dashboard
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
    volumes:
      - ./dashboard:/app
      - ./media:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8001:8001"
    deploy:
      resources:
        limits:
          memory: 2g        # cap at 2GB — prevents OOM kill from crashing the whole container
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8001 -t 600 --proxy-headers core.asgi:application"

  # ─── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: eids_nginx
    restart: unless-stopped
    depends_on:
      - fastapi
      - dashboard
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/static:ro
      - ./media:/app/media:ro
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_files:

networks:
  default:
    name: eids_network
